<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playlist - RoadTrip Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <script src="theme.js"></script>
</head>
<body>

  <div id="wrapper">
    <nav id="sidebar">
      <a class="brand" href="index.html">RoadTrip Music</a>
      <ul class="nav-links">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="create.html">Create Playlist</a></li>
        <li><a class="nav-link active" href="playlists.html">My Playlists</a></li>
        <li><a class="nav-link" href="search.html">Search</a></li>
      </ul>
      <div id="auth-controls">
        <button id="login-btn" onclick="spotifyLogin()">Log in with Spotify</button>
        <button id="logout-btn" onclick="logout()" style="display:none;">Log out</button>
      </div>
    </nav>

    <main id="content">

      <!-- Playlist Header -->
      <div id="playlist-header">
        <div id="playlist-cover"></div>
        <div id="playlist-header-info">
          <p id="playlist-type-label">PLAYLIST</p>
          <h1 id="playlist-title"></h1>
          <p id="playlist-desc-text"></p>
          <p id="playlist-route"></p>
          <p id="playlist-stats"></p>
          <button id="playlist-play-btn" onclick="playAll()">Play All</button>
        </div>
      </div>

      <!-- Track List -->
      <div id="playlist-tracks-list"></div>
      
    </main>
  </div>

  <!-- <script src="https://sdk.scdn.co/spotify-player.js"></script> -->
  <script src="spotify.js"></script>
  <script src="nav.js"></script>
  <script src="playlist.js"></script>

</body>
</html>
