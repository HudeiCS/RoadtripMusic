<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing - RoadTrip Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
  <div id="wrapper">
    <nav id="sidebar">
      <a class="brand" href="index.html">RoadTrip Music</a>
      <ul class="nav-links">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="create.html">Create Playlist</a></li>
        <li><a class="nav-link" href="playlists.html">My Playlists</a></li>
        <li><a class="nav-link" href="search.html">Search</a></li>
      </ul>
      <div id="auth-controls">
        <button id="login-btn" onclick="spotifyLogin()">Log in with Spotify</button>
        <button id="logout-btn" onclick="logout()" style="display:none;">Log out</button>
      </div>
    </nav>

    <main id="content">
  <div id="song-header">
    <img id="song-image" src="" alt="album art" />
    <div id="song-header-info">
      <h1 id="song-title"></h1>
      <p id="song-artist"></p>
      <button id="play-btn">Play</button>
    </div>
  </div>
  <div id="song-bar">
    <span id="song-bar-name"></span>
    <span id="song-bar-duration"></span>
  </div>

  <section id="more-by-artist" style="margin-top: 2.5rem;">
    <h2 id="more-heading"></h2>
    <div class="album-grid" id="more-grid"></div>
  </section>
</main>
  </div>

  <script src="spotify.js"></script>
  <script src="song.js"></script>
</body>
</html>
