<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RoadTrip Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <script src="theme.js"></script>
</head>
<body>

  <div id="wrapper">

    <!-- SIDEBAR NAV -->
    <nav id="sidebar">
      <a class="brand" href="index.html">RoadTrip Music</a>
      <ul class="nav-links">
        <li><a class="nav-link active" href="index.html">Home</a></li>
        <li><a class="nav-link" href="create.html">Create Playlist</a></li>
        <li><a class="nav-link" href="playlists.html">My Playlists</a></li>
        <li><a class="nav-link" href="search.html">Search</a></li>
      </ul>
      <div id="auth-controls">
        <button id="login-btn" onclick="spotifyLogin()">Log in with Spotify</button>
        <button id="logout-btn" onclick="logout()" style="display:none;">Log out</button>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="content">

      <!-- TOP TRACKS SECTION -->
      <section id="trending">
        <h1>Your Top Tracks</h1>
        <div class="album-grid"></div>
      </section>

      <!-- TOP ARTISTS SECTION -->
      <section id="trending-albums">
        <h1>Your Top Albums</h1>
        <div class="album-grid"></div>
      </section>
    </main>
  </div>
  <script src="spotify.js"></script>
  <script src="index.js"></script>
  <script src="nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
