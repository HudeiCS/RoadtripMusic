<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Playlists - RoadTrip Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <script src="theme.js"></script>
</head>

<body>

  <div id="wrapper">

    <!-- SIDEBAR NAV -->
    <nav id="sidebar">
      <a class="brand" href="index.html">RoadTrip Music</a>
      <ul class="nav-links">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="create.html">Create Playlist</a></li>
        <li><a class="nav-link active" href="playlists.html">My Playlists</a></li>
        <li><a class="nav-link" href="search.html">Search</a></li>
      </ul>
      <div id="auth-controls">
        <button id="login-btn" onclick="spotifyLogin()">Log in with Spotify</button>
        <button id="logout-btn" onclick="logout()" style="display:none;">Log out</button>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="content">

      <div class="section-header">
        <h1>My Playlists</h1>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <select id="sort-select">
            <option value="date">Sort: Date</option>
            <option value="name">Sort: Name</option>
            <option value="tracks">Sort: Track Count</option>
          </select>
          <a href="create.html" class="btn-create">Create Playlist</a>
        </div>
      </div>

      <!-- PLAYLIST GRID -->
      <div class="album-grid" id="playlists-grid"></div>
    </main>
  </div>
  <script src="spotify.js"></script>
  <script src="playlists.js"></script>
  <script src="nav.js"></script>
</body>

</html>
