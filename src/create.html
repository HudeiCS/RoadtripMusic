<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Playlist - Travel Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

  <div id="wrapper">
    <nav id="sidebar">
      <a class="brand" href="index.html">Travel Music</a>
      <ul class="nav-links">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link active" href="create.html">Create Playlist</a></li>
        <li><a class="nav-link" href="playlists.html">My Playlists</a></li>
        <li><a class="nav-link" href="search.html">Search</a></li>
      </ul>
      <div id="auth-controls">
        <button id="login-btn" onclick="spotifyLogin()">Log in with Spotify</button>
        <button id="logout-btn" onclick="logout()" style="display:none;">Log out</button>
      </div>
    </nav>

    <main id="content">
      <h1 style="margin-bottom: 1.5rem;">Create Playlist</h1>

      <div id="create-form">

        <!-- Playlist details -->
        <div class="create-section">
          <label for="playlist-name">Playlist Name</label>
          <input type="text" id="playlist-name" placeholder="My Road Trip Mix" />
        </div>
        <div class="create-section">
          <label for="playlist-desc">Description (optional)</label>
          <input type="text" id="playlist-desc" placeholder="Songs for the open road…" />
        </div>

        <!-- Track search -->
        <div class="create-section">
          <label for="track-search-input">Add Tracks</label>
          <input type="text" id="track-search-input" placeholder="Search for a song…" />
          <div id="track-results"></div>
        </div>

        <!-- Selected tracks -->
        <div class="create-section">
          <div class="section-header" style="margin-bottom: 0.5rem;">
            <span id="track-count">0 tracks added</span>
          </div>
          <div id="selected-tracks"></div>
        </div>

        <button id="create-playlist-btn">Create Playlist</button>
        <p id="create-status"></p>
      </div>
    </main>
  </div>

  <div id="player-bar" style="display:none;">
    <img id="player-album-art" src="" alt="album art" />
    <div id="player-track-info">
      <span id="player-track-name">—</span>
      <span id="player-artist">—</span>
    </div>
    <div id="player-controls">
      <button onclick="skipPrev()">⏮</button>
      <button id="player-play-btn" onclick="togglePlay()">▶</button>
      <button onclick="skipNext()">⏭</button>
    </div>
    <div id="player-progress-wrap">
      <span id="player-current-time">0:00</span>
      <div id="player-progress-bar"><div id="player-progress-fill"></div></div>
      <span id="player-duration">0:00</span>
    </div>
    <div id="player-volume-wrap">
      <span>🔈</span>
      <input type="range" id="volume-slider" min="0" max="100" value="80"
        oninput="setVolume(this.value)" />
    </div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/player.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
